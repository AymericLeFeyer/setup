<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup</title>
    <meta name="description"
        content="Découvrez mon setup de bureau interactif. Survolez les équipements pour en savoir plus.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="ambient-background"></div>

    <!-- Navigation entre les setups (masquée s'il n'y en a qu'un) -->
    <nav class="setup-nav" id="setup-nav" hidden aria-label="Choix du setup"></nav>

    <div class="content">
        <header class="header">
            <h1 id="setup-title">Mon Setup</h1>
        </header>

        <main class="setup-container">
            <div class="image-wrapper" id="image-wrapper">
                <img src="" alt="Photo de mon setup de bureau" class="setup-image" id="setup-image">
                <button type="button" class="zoom-btn" id="zoom-btn" title="Voir l'image en grand"
                    aria-label="Voir l'image en grand, sans les points">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6" />
                    </svg>
                </button>
                <div id="coordinates-display" class="coordinates-display">X: 0%, Y: 0%</div>
                <!-- Les marqueurs seront injectés ici par app.js -->
            </div>
        </main>

        <section class="setup-description-section" id="description-section">
            <h2>Description</h2>
            <div class="description-card">
                <p id="setup-description"></p>
            </div>
        </section>

        <section class="equipment-section" id="equipment-container">
            <!-- Les catégories seront injectées ici par app.js -->
        </section>

        <footer class="footer">
            <p>Conçu avec soin par <a href="https://github.com/JamesDAdams/setup">JamesDAdams</a> pour une expérience optimale.</p>
        </footer>
    </div>

    <!-- Vue plein écran de la photo, sans les marqueurs -->
    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo du setup en grand">
        <button type="button" class="lightbox-close" id="lightbox-close" title="Fermer" aria-label="Fermer">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M6 6l12 12M18 6L6 18" />
            </svg>
        </button>
        <img src="" alt="" class="lightbox-image" id="lightbox-image">
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
