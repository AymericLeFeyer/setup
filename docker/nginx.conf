server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rien ne doit pouvoir servir l'éditeur : il n'est pas dans l'image, mais on
    # bloque aussi le chemin au cas où un volume serait monté par-dessus le site.
    location ^~ /config {
        return 404;
    }

    location = /data.js.bak {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # `expires` seul (et non add_header) : un add_header dans un location
    # annulerait les en-têtes de sécurité hérités du bloc server.
    location = /data.js {
        expires -1;
    }

    location ~* \.(css|js)$ {
        expires 1h;
    }

    location ~* \.(jpe?g|png|webp|gif|svg|ico|avif)$ {
        expires 30d;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # Durcissement minimal
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
