name: Image Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nécessaire pour construire l'image arm64 (Raspberry Pi, NAS ARM…)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # --- Vérification avant publication ---

      - name: Build local (amd64) pour vérification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: setup-check:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérifier que l'éditeur n'est pas dans l'image
        run: |
          contents=$(docker run --rm --entrypoint sh setup-check:ci -c 'ls -R /usr/share/nginx/html')
          echo "$contents"
          if echo "$contents" | grep -qiE 'config|server\.js|serializer\.js|data\.js\.bak'; then
            echo "::error::Des fichiers de configuration sont présents dans l'image !"
            exit 1
          fi
          echo "OK : l'image ne contient que le site public."

      - name: Vérifier que nginx sert bien le site
        run: |
          docker run -d --name setup-test -p 8080:80 setup-check:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q 'setup-image'
          curl -fsS http://127.0.0.1:8080/data.js > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/config/)
          if [ "$code" != "404" ]; then
            echo "::error::/config/ répond $code au lieu de 404"
            exit 1
          fi
          docker rm -f setup-test
          echo "OK : site servi, /config/ bloqué."

      # --- Publication ---

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags et labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build multi-arch et push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapitulatif
        run: |
          echo "### Image publiée" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
